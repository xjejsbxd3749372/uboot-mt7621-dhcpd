name: qemu-mt7621-boot

on:
  workflow_dispatch:
  push:
    paths:
      - 'qemu-mt7621/**'
      - '.github/workflows/qemu-mt7621-boot.yml'

jobs:
  simulated-boot:
    name: MT7621 QEMU simulated boot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QEMU_VERSION: '9.2.0'
      # gh needs an explicit token in Actions; without it every `gh api`
      # call fails with exit 4 and the boot never runs.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build meson pkg-config \
            python3-venv python3-pip git curl ca-certificates \
            libglib2.0-dev libpixman-1-dev zlib1g-dev flex bison

      - name: cache the QEMU build tree
        uses: actions/cache@v4
        with:
          path: /tmp/qemu-mt7621-build
          key: qemu-mt7621-${{ env.QEMU_VERSION }}-${{ hashFiles('qemu-mt7621/hw/**', 'qemu-mt7621/include/**', 'qemu-mt7621/scripts/build_qemu.sh') }}

      - name: build QEMU with the MT7621 model
        run: bash qemu-mt7621/scripts/build_qemu.sh

      - name: fetch the stock NAND dump
        id: dump
        run: |
          set -euo pipefail
          # full.bin is a 128MiB logical partition dump of this router. It is
          # published as a release asset so CI can boot the real contents.
          url=$(gh api repos/${{ github.repository }}/releases \
                --jq '.[] | select(.tag_name=="nand-dump") | .assets[]
                       | select(.name=="mi-router-4-full.bin") | .browser_download_url' \
                2>/dev/null | head -1 || true)
          if [ -n "${url:-}" ]; then
            echo "downloading the stock NAND dump"
            curl -sSL --max-time 900 -o full.bin "$url"
          else
            echo "::warning::no stock NAND dump published; composing a blank device"
            head -c $((128*1024*1024)) /dev/zero | tr '\0' '\377' > full.bin
          fi
          echo "dump: $(stat -c%s full.bin)B"
          echo "has_dump=$([ -s full.bin ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: fetch the U-Boot build under test
        run: |
          set -euo pipefail
          # The flash-ready image is the BINMAN output: it is the only
          # artefact that contains both stages - the SPL uImage at 0x0 and the
          # LZMA U-Boot payload at 0x20000. The plain `u-boot_*.img` asset is
          # just mkimage(u-boot.bin) and has no first stage, so BootROM would
          # never reach a main U-Boot banner from it.
          url=$(gh api repos/${{ github.repository }}/releases/latest \
                --jq '.assets[] | select(.name|test("^u-boot-mt7621_.*\\.bin$")) | .browser_download_url' \
                | head -1)
          if [ -z "$url" ]; then
            echo "::warning::no u-boot-mt7621_*.bin asset; falling back to u-boot_*.img"
            url=$(gh api repos/${{ github.repository }}/releases/latest \
                  --jq '.assets[] | select(.name|test("^u-boot_.*\\.img$")) | .browser_download_url' \
                  | head -1)
          fi
          echo "u-boot asset: $url"
          curl -sSL --max-time 300 -o u-boot.img "$url"
          echo "u-boot: $(stat -c%s u-boot.img)B"

      - name: compose the 128MiB flash image
        run: |
          python3 qemu-mt7621/scripts/compose_flash.py \
            -o flash.bin --uboot u-boot.img --dump full.bin
          sha256sum flash.bin

      - name: run and grade the simulated boot
        run: |
          bash qemu-mt7621/scripts/run_boot.sh \
            /tmp/qemu-mt7621-build/build/qemu-system-mipsel \
            flash.bin 90 boot.log 3

      - name: upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt7621-boot
          path: |
            boot.log
          if-no-files-found: warn
