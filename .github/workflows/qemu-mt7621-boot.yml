name: qemu-mt7621-boot

on:
  workflow_dispatch:
  push:
    paths:
      - 'qemu-mt7621/**'
      - '.github/workflows/qemu-mt7621-boot.yml'

jobs:
  simulated-boot:
    name: MT7621 QEMU simulated boot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QEMU_VERSION: '9.2.0'
      # gh needs an explicit token in Actions; without it every `gh api`
      # call fails with exit 4 and the boot never runs.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build meson pkg-config \
            python3-venv python3-pip git curl ca-certificates \
            libglib2.0-dev libpixman-1-dev zlib1g-dev flex bison

      - name: cache the QEMU build tree
        uses: actions/cache@v4
        with:
          path: /tmp/qemu-mt7621-build
          key: qemu-mt7621-${{ env.QEMU_VERSION }}-${{ hashFiles('qemu-mt7621/hw/**', 'qemu-mt7621/include/**', 'qemu-mt7621/scripts/build_qemu.sh') }}

      - name: build QEMU with the MT7621 model
        run: bash qemu-mt7621/scripts/build_qemu.sh

      - name: fetch the stock NAND dump
        id: dump
        run: |
          set -euo pipefail
          # full.bin is a 128MiB logical partition dump of this router. It is
          # published as a release asset so CI can boot the real contents.
          url=$(gh api repos/${{ github.repository }}/releases \
                --jq '.[] | select(.tag_name=="nand-dump") | .assets[]
                       | select(.name=="mi-router-4-full.bin") | .browser_download_url' \
                2>/dev/null | head -1 || true)
          if [ -n "${url:-}" ]; then
            echo "downloading the stock NAND dump"
            curl -sSL --max-time 900 -o full.bin "$url"
          else
            echo "::warning::no stock NAND dump published; composing a blank device"
            head -c $((128*1024*1024)) /dev/zero | tr '\0' '\377' > full.bin
          fi
          echo "dump: $(stat -c%s full.bin)B"
          echo "has_dump=$([ -s full.bin ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: fetch the U-Boot builds under test
        run: |
          set -euo pipefail
          # Two artefacts are booted. The flash-ready one is the BINMAN
          # output: it is the only file containing both stages - the SPL uImage
          # at 0x0 and the LZMA U-Boot payload at 0x20000 - and it is what the
          # hardware actually runs, so it decides pass/fail. The plain
          # `u-boot_*.img` is just mkimage(u-boot.bin) with no first stage; it
          # is booted afterwards as a comparison, because if it reaches a
          # banner while the real chain does not, the problem is in the SPL
          # stage rather than in U-Boot itself.
          # releases/latest is only "whichever release was published most
          # recently", so a release with no U-Boot asset - the nand-dump stock
          # release, or another board's build - breaks it with "got 0". Walk
          # every release instead: the API returns them newest first, so the
          # first asset matching this board's name is the newest build for it,
          # and a release that does not carry that asset simply contributes
          # nothing. Still pinned to this board so another model's binary can
          # never be booted, and .[0] means a wrong count cannot be hidden.
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[].assets[]
                   | select(.name|test("^u-boot-mt7621_Xiaomi_Mi_Router_4_.*\\.bin$"))
                   | .browser_download_url] | .[0] // empty' > flash.url
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[].assets[]
                   | select(.name|test("^u-boot_Xiaomi_Mi_Router_4_.*\\.img$"))
                   | .browser_download_url] | .[0] // empty' > main.url

          [ "$(wc -l < flash.url)" -eq 1 ] || { echo "::error::expected exactly one flash asset, got $(wc -l < flash.url)"; exit 1; }

          [ -s flash.url ] || { echo "::error::no u-boot-mt7621_*.bin asset"; exit 1; }
          [ -s main.url ] || echo "::warning::no u-boot_*.img asset, skipping the comparison boot"

          curl -sSL --max-time 300 -o u-boot-flash.bin "$(cat flash.url)"
          echo "flash image : u-boot-flash.bin $(stat -c%s u-boot-flash.bin)B"
          if [ -s main.url ]; then
            curl -sSL --max-time 300 -o u-boot-main.img "$(cat main.url)"
            echo "main u-boot : u-boot-main.img $(stat -c%s u-boot-main.img)B"
          fi

      - name: compose the 128MiB flash images
        run: |
          set -euo pipefail
          python3 qemu-mt7621/scripts/compose_flash.py \
            -o flash.bin --uboot u-boot-flash.bin --dump full.bin
          sha256sum flash.bin
          # Informational only. It shares this step with the primary compose, so a
          # non-zero exit here would kill the step under `set -euo pipefail` and skip
          # the real test entirely.
          if [ -f u-boot-main.img ]; then
            python3 qemu-mt7621/scripts/compose_flash.py \
              -o flash-main.bin --uboot u-boot-main.img --dump full.bin \
            || echo "::warning::comparison image not composable, comparison boot will be skipped"
          fi

      - name: run and grade the simulated boot (SPL + payload)
        run: |
          bash qemu-mt7621/scripts/run_boot.sh \
            /tmp/qemu-mt7621-build/build/qemu-system-mipsel \
            flash.bin 90 boot.log 3

      - name: comparison boot (main U-Boot only, informational)
        if: always()
        run: |
          if [ -f flash-main.bin ]; then
            bash qemu-mt7621/scripts/run_boot.sh \
              /tmp/qemu-mt7621-build/build/qemu-system-mipsel \
              flash-main.bin 90 boot-main.log 3 || true
          else
            echo "no main-U-Boot image to compare against"
          fi

      - name: upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt7621-boot
          path: |
            boot.log.extract
            boot-main.log.extract
          if-no-files-found: warn
